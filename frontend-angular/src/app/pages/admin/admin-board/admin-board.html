<div class="admin-container">
  <mat-tab-group>
    <mat-tab label="Painel Administrativo">
      <div class="tab-content">
        <mat-card>
          <mat-card-header>
            <mat-card-title>Painel Administrativo</mat-card-title>
            <mat-card-subtitle>Gestão de Usuarios</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <table
              mat-table
              [dataSource]="dataSource"
              class="mat-elevation-z2 full-width"
            >
              <!-- ID -->
              <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let user">{{ user.id }}</td>
              </ng-container>

              <!-- Nome -->
              <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Nome</th>
                <td mat-cell *matCellDef="let user">{{ user.nome }}</td>
              </ng-container>

              <!-- Ações -->
              <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Ações</th>
                <td mat-cell *matCellDef="let user">
                  <button
                    mat-icon-button
                    color="warn"
                    (click)="removeUser(user.id)"
                  >
                    <mat-icon>delete</mat-icon>
                  </button>
                </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
            @if (dataSource.data.length === 0) {
              <div class="empty-state">Nenhum usuário encontrado</div>
            }
          </mat-card-content>
        </mat-card>
      </div>
    </mat-tab>

    <mat-tab label="Painel de Aprovações">
      <div class="tab-content">
        <app-approval-list></app-approval-list>
      </div>
    </mat-tab>

    <mat-tab label="Painel de Auditoria">
      <div class="tab-content">
        <app-auditlog-list></app-auditlog-list>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
