# App properties Testes
spring.application.name=service-backend-unit
spring.config.activate.on-profile=unit

# Database/JPA/Hibernate Configuration
# H2 Configurations
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver=org.h2.Driver

#JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Desabilitar Flyway e Liquibase em testes
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration/test
spring.flyway.baselineOnMigrate=false
spring.liquibase.enabled=false
spring.sql.init.mode=never

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

logging.level.com.example.backend=${BACKEND_LOG_LEVEL:INFO}
logging.level.root=${GLOBAL_LOG_LEVEL:INFO}