services:
  service-backend:
    depends_on:
      postgres:
        condition: service_healthy
    build: 
      context: ./service-backend
      dockerfile: Dockerfile
    image: leoalmeida/service-backend:latest
    container_name: service-backend
    env_file: ./.env
    ports:
      - ${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}
    environment: 
      SPRING_LOCAL_PORT: ${SPRING_DOCKER_PORT}
      SPRING_APPLICATION_JSON: '{
          "spring.datasource.url" : "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}",
          "spring.datasource.username" : "${DB_USERNAME}",
          "spring.datasource.password" : "${DB_PASSWORD}",
          "security.jwt.secret" : "${JWT_SECRET}"
        }'
    volumes:
      - .m2:/root/.m2
    stdin_open: true
    tty: true
    networks:
      - app-network

  gateway-node:
    build:
      context: ./gateway-node
      dockerfile: Dockerfile
    image: leoalmeida/gateway-node:latest
    container_name: gateway-node
    ports:
      - ${API_GATEWAY_LOCAL_PORT}:${API_GATEWAY_DOCKER_PORT}
    environment:
      PORT: ${API_GATEWAY_DOCKER_PORT}
      BACKEND_BASE_URL: http://service-backend:${SPRING_DOCKER_PORT}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./gateway-node:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - service-backend
    networks:
      - app-network
      
  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    image: leoalmeida/frontend-angular:latest
    container_name: frontend-angular
    ports:
      - ${FRONTEND_LOCAL_PORT}:${FRONTEND_DOCKER_PORT}
    environment:
      PORT: ${FRONTEND_DOCKER_PORT}
    volumes:
      - ./frontend-angular:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - gateway-node
    networks:
      - app-network

  
  postgres:
    image: postgres:13
    container_name: postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
    ports:
      - "${POSTGRES_LOCAL_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge

