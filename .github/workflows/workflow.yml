name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-workflow:
    uses: ./.github/workflows/workflow-backend.yml
    secrets: inherit
  
  frontend-workflow:
    uses: ./.github/workflows/workflow-frontend.yml
    secrets: inherit
  
  gateway-workflow:
    uses: ./.github/workflows/workflow-gateway.yml
    secrets: inherit

  # Uncomment below to enable Docker build and push after all tests pass
