name: CI - Backend Service

on:
  workflow_call:

jobs:
  code-quality-backend:
    uses: ./.github/workflows/code-quality-backend.yml
    secrets: inherit
  
  test-backend:
    needs: [code-quality-backend]
    uses: ./.github/workflows/testes-backend.yml
    secrets: inherit

  build-backend:
    needs: [test-backend]
    uses: ./.github/workflows/build-backend.yml
    secrets: inherit