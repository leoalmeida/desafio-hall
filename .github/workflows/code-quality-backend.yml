name: Code Quality Analysis for Backend Module

on:
  workflow_call:

jobs:
  code-quality-backend:
    name: Lint Backend Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
s
      - name: Run Spotless Format Check
        run: mvn -B -f service-backend/pom.xml spotless:check

      - name: Run Checkstyle
        run: mvn -B -f service-backend/pom.xml checkstyle:check

      - name: Run PMD check
        run: mvn -B -f service-backend/pom.xml pmd:check
      
      - name: Run SpotBugs check
        run: mvn -B -f service-backend/pom.xml spotbugs:check
        
