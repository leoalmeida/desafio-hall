name: Docker Hub Image

on:
  workflow_call:

jobs:
  docker-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set Docker Build
        uses: docker/setup-buildx-action@v3
      
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWD }}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          file: ./service-backend/Dockerfile
          context: ./service-backend
          push: true
          tags: leoalmeida/service-backend:${{github.run_number}}
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          file: ./frontend-angular/Dockerfile
          context: ./frontend-angular
          push: true
          tags: leoalmeida/frontend-angular:${{github.run_number}}
      
      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          file: ./gateway-node/Dockerfile
          context: ./gateway-node
          push: true
          tags: leoalmeida/gateway-node:${{github.run_number}}